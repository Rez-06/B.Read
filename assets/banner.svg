<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">B.read — better read</title>
  <desc id="desc">Animated banner for B.read: a PDF-first reader with lecture-synced notes.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="0.6" stop-color="#0d1226"/>
      <stop offset="1" stop-color="#1b1038"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#818cf8;#f472b6;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#22d3ee;#818cf8;#f472b6" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="orb" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1800" height="1000">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-100" y="0" width="900" height="300">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="8s" repeatCount="indefinite"/>
    </pattern>

    <clipPath id="round">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>

    <!-- typewriter reveal for the tagline -->
    <clipPath id="typed">
      <rect x="66" y="226" width="0" height="44">
        <animate attributeName="width" values="0;548;548;0" keyTimes="0;0.35;0.9;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- drifting colour orbs -->
    <g filter="url(#orb)">
      <circle cx="220" cy="110" r="150" fill="#22d3ee" opacity="0.28">
        <animateTransform attributeName="transform" type="translate" values="0 0;90 50;0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="340" r="170" fill="#f472b6" opacity="0.24">
        <animateTransform attributeName="transform" type="translate" values="0 0;-80 -40;0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="40" r="120" fill="#818cf8" opacity="0.25">
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 60;0 0" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- twinkling particles -->
    <g fill="#ffffff">
      <circle cx="700" cy="60" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="372" r="1.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="70" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="330" r="1.8"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="380" r="1.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.8s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="30" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="40" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- eyebrow -->
    <text x="70" y="78" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" letter-spacing="4" fill="#94a3b8">B. = BETTER  ·  READ = READ</text>

    <!-- title: glow layer + crisp layer -->
    <text x="66" y="200" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="140" font-weight="800" letter-spacing="-4" fill="url(#accent)" filter="url(#glow)" opacity="0.6">
      B.read
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="66" y="200" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="140" font-weight="800" letter-spacing="-4" fill="url(#accent)">B.read</text>

    <!-- typewriter tagline -->
    <g clip-path="url(#typed)">
      <text x="66" y="256" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="26" fill="#e2e8f0" textLength="548" lengthAdjust="spacing">Read better. Sync with the lecture.</text>
    </g>
    <rect y="232" width="3" height="30" fill="#22d3ee">
      <animate attributeName="x" values="66;614;614;66" keyTimes="0;0.35;0.9;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <!-- pills -->
    <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#cbd5e1" text-anchor="middle">
      <rect x="70" y="296" width="104" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
      <text x="122" y="318">PDF-first</text>

      <rect x="186" y="296" width="150" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
      <text x="261" y="318">Tauri 2 + Rust</text>

      <rect x="348" y="296" width="130" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="#334155"/>
      <text x="413" y="318">Bangla-ready</text>

      <rect x="490" y="296" width="190" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="url(#accent)"/>
      <circle cx="510" cy="313" r="4" fill="#f472b6">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="530" y="318" text-anchor="start">early development</text>
    </g>

    <!-- ───────── right side: the product, in motion ───────── -->

    <!-- stacked page behind -->
    <rect x="800" y="62" width="220" height="280" rx="14" fill="#1e293b" transform="rotate(-10 910 200)"/>

    <!-- main PDF page -->
    <g transform="rotate(-4 890 200)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
        <rect x="780" y="56" width="230" height="290" rx="14" fill="#f8fafc"/>
        <rect x="802" y="80" width="96" height="12" rx="6" fill="#0f172a"/>

        <g fill="#cbd5e1">
          <rect x="802" y="112" width="186" height="8" rx="4"/>
          <rect x="802" y="134" width="170" height="8" rx="4"/>
          <rect x="802" y="156" width="186" height="8" rx="4"/>
          <rect x="802" y="178" width="150" height="8" rx="4"/>
          <rect x="802" y="200" width="186" height="8" rx="4"/>
          <rect x="802" y="222" width="176" height="8" rx="4"/>
          <rect x="802" y="244" width="120" height="8" rx="4"/>
        </g>

        <!-- reading highlight, hopping line by line -->
        <rect x="798" y="107" width="194" height="18" rx="5" fill="url(#accent)" opacity="0.4">
          <animate attributeName="y" values="107;129;151;173;195;217;239" dur="7s" calcMode="discrete" repeatCount="indefinite"/>
        </rect>

        <!-- figure block -->
        <rect x="802" y="268" width="186" height="54" rx="8" fill="#e0e7ff"/>
        <path d="M812 312 L836 292 L860 304 L890 280 L920 296 L948 284 L978 300" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- sync link between page and transcript -->
    <path d="M 988 150 C 1020 150 940 214 902 214" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- Subtext transcript card -->
    <g transform="rotate(3 1030 250)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6s" repeatCount="indefinite"/>
        <rect x="900" y="140" width="250" height="210" rx="16" fill="#0b1220" fill-opacity="0.96" stroke="url(#accent)" stroke-width="1.5"/>

        <circle cx="922" cy="166" r="5" fill="#f43f5e">
          <animate attributeName="r" values="4;6;4" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0.5;1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
        <text x="936" y="170" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" letter-spacing="1.5" fill="#94a3b8">SUBTEXT · SYNCED</text>
        <line x1="914" y1="184" x2="1136" y2="184" stroke="#1e293b"/>

        <!-- active row highlight, in step with the page -->
        <rect x="910" y="194" width="230" height="30" rx="8" fill="url(#accent)" opacity="0.2">
          <animate attributeName="y" values="194;228;262;296" dur="7s" calcMode="discrete" repeatCount="indefinite"/>
        </rect>

        <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13">
          <text x="920" y="214" fill="#22d3ee">00:42</text>
          <text x="920" y="248" fill="#22d3ee">03:10</text>
          <text x="920" y="282" fill="#22d3ee">07:25</text>
          <text x="920" y="316" fill="#22d3ee">12:02</text>
        </g>
        <g font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0">
          <text x="976" y="214">Intro</text>
          <text x="976" y="248">Key idea</text>
          <text x="976" y="282">Worked example</text>
          <text x="976" y="316">Summary</text>
        </g>
        <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#94a3b8" text-anchor="end">
          <text x="1130" y="214">p.1</text>
          <text x="1130" y="248">p.4</text>
          <text x="1130" y="282">p.9</text>
          <text x="1130" y="316">p.14</text>
        </g>
      </g>
    </g>

    <!-- bottom accent bar with travelling shine -->
    <rect x="0" y="414" width="1200" height="6" fill="url(#accent)"/>
    <rect y="414" width="260" height="6" fill="url(#shine)">
      <animate attributeName="x" values="-260;1200" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
